# =============================================================================
# MODSTAN - Device Configuration File
# =============================================================================
# Copy this file and adjust it for your device.
# Example: cp example.conf METER01.conf
# Security: chmod 600 METER01.conf
# =============================================================================

[DEVICE]
# Unique device name (used as the device_name column value in the database)
name     = METER01

# Default polling interval for all registers (in seconds)
# If not set, defaults to 1 second
interval = 5


[MODBUS]
# IP address or hostname of the Modbus TCP device
host = 127.0.0.1

# Modbus TCP port (default: 502)
port = 502

# Modbus Slave ID (default: 1)
slave_id = 1

# Connection timeout in seconds (default: 10)
timeout = 10

# Maximum reconnect attempts before giving up (0 = retry indefinitely)
max_retries = 0

# Delay between reconnect attempts in seconds (default: 5)
retry_delay = 5


[STORAGE]
# Enable data storage to database (true/false)
# false = data is only printed to terminal and log file (testing mode)
enabled  = false

# Database type: postgres | mariadb | sqlite | csv
type     = postgres

# Database connection settings
host     = 127.0.0.1
port     = 5432
database = db_sample
username = root
password = secret123

# Main table name (default: register_logs)
table    = register_logs

# Data retention in days (0 = keep forever)
retention = 30


[OWNER]
# Ownership / identity metadata (optional, used for logging purposes)
customer_id = 001
tag_host    = PANEL-A
tag_name    = MAIN-METER


[REGISTERS]
# Format: function_code, address, quantity, data_type, scale, byte_format[, interval]
#
# function_code : 3 = Holding Register, 4 = Input Register
# address       : Register address (decimal)
# quantity      : Number of registers to read
# data_type     : uint16 | int16 | uint32 | int32 | uint64 | int64 | float32 | float64
# scale         : Multiplier applied to the converted value (e.g. 0.1 = divide by 10)
# byte_format   : ABCD | CDAB | BADC | DCBA | AB | BA
# interval      : (optional) Per-register poll interval override in seconds
#                 If omitted, uses the interval defined in [DEVICE]
#
# Examples:
# temperature      = 3, 100, 2, float32, 0.1,  ABCD
# ph_value      = 3, 102, 2, float32, 0.01, ABCD,  10



temperature  = 3, 200, 2, float32, 0.1,  ABCD,   30
energy = 3, 300, 4, float32, 1.0,  ABCD,   
